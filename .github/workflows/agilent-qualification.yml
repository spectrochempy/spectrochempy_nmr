name: Agilent real-provider qualification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  agilent-real:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      NMR_AGILENT_REAL_DATA: /tmp/agilent-real
      NMR_PIPE_COSY_REFERENCE: /tmp/nmrpipe_2d_cosy_example.ft2
      NMRML_QUALIFICATION_DATA: /tmp/nmrml-real
      NMR_PDATA_TOMATO_DATA: /tmp/pdata-real/MMBBI_10M12-CE01-1a/1/pdata/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Secure pip bootstrap
        uses: spectrochempy/spectrochempy/.github/actions/verified-pip@cdb087a24f06b8c83ea91ea036192304db9329e3
      - name: Build and install wheels with released core and provider wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install "spectrochempy==1.1.4" pytest
          python -m pip install --only-binary nmrglue-ng -r tests/qualification/requirements.txt dist/*.whl
          python -m pip check
      - name: Verify provider release and installed package isolation
        run: |
          python -I - <<'PY'
          from importlib.metadata import version
          from importlib.util import find_spec
          from pathlib import Path

          assert version("nmrglue-ng") == "1.2.1"
          for name in ("spectrochempy", "spectrochempy_nmr", "nmrglue"):
              location = Path(find_spec(name).origin).resolve()
              assert Path.cwd() not in location.parents, location
              print(f"{name}: {location}")
          PY
      - name: Fetch original nmrML example and verify checksums
        run: python tools/fetch_agilent_qualification.py "$NMR_AGILENT_REAL_DATA"
      - name: Run real-provider qualification
        run: python -I -m pytest -ra tests/qualification/test_agilent_real.py
      - name: Run synthetic Bruker normalized-provider qualification
        run: python -I -m pytest -ra tests/qualification/test_bruker_normalized.py -k synthetic
      - name: Fetch checksum-pinned Bruker pdata reference
        run: python tools/fetch_pdata_qualification.py /tmp/pdata-real
      - name: Run processed-spectrum real-provider qualification
        run: python -I -m pytest -ra tests/qualification/test_pdata_real.py
      - name: Qualify synthetic four-component Bruker pdata
        run: python -I -m pytest -ra tests/qualification/test_bruker_pdata_2d.py -k "synthetic and not public_reader"

      - name: Run synthetic NMRPipe normalized-provider qualification
        run: python -I -m pytest -ra tests/qualification/test_nmrpipe_interop.py -k synthetic

      - name: Fetch and qualify the checksum-pinned NMRPipe COSY spectrum
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/spectrochempy/nmrglue-ng/14f5ee8b06592060a987cbd12f79c6e9a36c8a20/tests/fixtures/fileio/data/nmrpipe_2d_cosy_example.ft2 \
            --output "$NMR_PIPE_COSY_REFERENCE"
          echo "d13dc13c928394d2f8c7c57c0f65bdeab510d935093793406f53d7609ee70cb5  $NMR_PIPE_COSY_REFERENCE" | sha256sum -c -
          python -I -m pytest -ra tests/qualification/test_nmrpipe_interop.py::test_real_nmrpipe_cosy_plane

      - name: Fetch checksum-pinned nmrML XML and native reference examples
        run: python tools/fetch_nmrml_qualification.py "$NMRML_QUALIFICATION_DATA"
      - name: Run nmrML raw and processed interop qualification
        run: python -I -m pytest -ra tests/qualification/test_nmrml_interop.py

      - name: Check out the merged Bruker FID provider contract
        uses: actions/checkout@v7
        with:
          repository: spectrochempy/nmrglue-ng
          ref: 55c0a105fc83c669e6b4107f0256717383dc50e7
          fetch-depth: 0
          path: provider-candidate
          persist-credentials: false
      - name: Qualify the public Bruker FID route with the candidate wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir provider-dist ./provider-candidate
          python -m pip install --force-reinstall --no-deps provider-dist/*.whl
          python -m pip check
          python -I - <<'PY'
          from inspect import signature
          from nmrglue.interop import normalize_bruker_fid, normalize_bruker_ser_qf, normalize_bruker_ser_states_tppi, read_bruker_ser

          assert "preserve_storage" in signature(normalize_bruker_fid).parameters
          assert "fft_presentation" in signature(normalize_bruker_ser_qf).parameters
          assert "qf_only" in signature(read_bruker_ser).parameters
          assert "fft_presentation" in signature(normalize_bruker_ser_states_tppi).parameters
          PY
          python -I -m pytest -ra tests/qualification/test_bruker_normalized.py -k synthetic
          python -I -m pytest -ra tests/test_experiment_interop.py -k fid_preparation
      - name: Check out core with FFT prevalidation
        uses: actions/checkout@v7
        with:
          repository: spectrochempy/spectrochempy
          ref: ba25df0c21d117bc99cb9dbe11c6ed92a3b275a9
          path: baseline-core
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify public SER FFT ordering before mutation
        run: |
          git -C baseline-core fetch --no-tags https://github.com/spectrochempy/spectrochempy.git refs/tags/spectrochempy-v1.1.4:refs/tags/spectrochempy-v1.1.4
          test "$(git -C baseline-core rev-parse 'spectrochempy-v1.1.4^{commit}')" = a96cb8a6ec076da2fbd9f0e34f24f9955705cf1a
          python -m pip wheel --no-deps --wheel-dir baseline-wheels ./baseline-core
          python -m pip install --no-deps --force-reinstall baseline-wheels/*.whl
          python -m pip check
          python -I -m pytest -ra tests/qualification/test_bruker_qf_public.py tests/qualification/test_bruker_states_tppi_public.py -k synthetic
