name: Candidate artifacts and synthetic tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Secure pip bootstrap
        uses: spectrochempy/spectrochempy/.github/actions/verified-pip@cdb087a24f06b8c83ea91ea036192304db9329e3
      - name: Install development hooks
        run: python -m pip install "pre-commit==4.6.2"
      - name: Run standalone hooks
        run: pre-commit run --all-files --show-diff-on-failure

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Secure pip bootstrap
        uses: spectrochempy/spectrochempy/.github/actions/verified-pip@cdb087a24f06b8c83ea91ea036192304db9329e3
      - name: Build sdist and wheel from sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify packaged notices and runtime parity
        run: |
          python - <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          source = Path("src/spectrochempy_nmr")
          notices = ("LICENSE", "NMRGLUE_LICENSE.rst")
          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))

          with zipfile.ZipFile(wheel) as archive:
              for notice in notices:
                  member = next(n for n in archive.namelist() if n.endswith("/" + notice))
                  if archive.read(member) != Path(notice).read_bytes():
                      sys.exit(f"wheel notice mismatch: {notice}")
              packaged = sorted(
                  name
                  for name in archive.namelist()
                  if name.startswith("spectrochempy_nmr/") and name.endswith(".py")
              )
              for name in packaged:
                  local = source / name.split("spectrochempy_nmr/", 1)[1]
                  if archive.read(name) != local.read_bytes():
                      sys.exit(f"wheel runtime mismatch: {name}")

          with tarfile.open(sdist) as archive:
              for notice in notices:
                  member = next(n for n in archive.getnames() if n.endswith("/" + notice))
                  if archive.extractfile(member).read() != Path(notice).read_bytes():
                      sys.exit(f"sdist notice mismatch: {notice}")

          print(f"Verified both notices and {len(packaged)} runtime files")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-dist
          path: dist/*
          if-no-files-found: error

  released-core:
    needs: artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # Keep the protected 1.1.3 checks alongside the floor and latest release.
        spectrochempy-version: ["1.1.0", "1.1.3", "1.1.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Secure pip bootstrap
        uses: spectrochempy/spectrochempy/.github/actions/verified-pip@cdb087a24f06b8c83ea91ea036192304db9329e3
      - uses: actions/download-artifact@v8
        with:
          name: plugin-dist
          path: dist
      - name: Install released core and candidate artifact
        run: |
          python -m pip install "spectrochempy==${{ matrix.spectrochempy-version }}" pytest
          python -m pip install dist/*.whl
          python -m pip check
      - name: Run synthetic tests against installed artifacts
        run: |
          python -I -m pytest -ra tests/test_linear_prediction.py tests/test_fft_encodings.py tests/test_fft_2d_characterization.py tests/test_nmrpipe_oracle_conventions.py tests/test_nmrpipe_states_tppi_oracle.py tests/test_nmrpipe_echo_antiecho_oracle.py tests/test_native_readers.py::test_jeol_real_qf_reader_preserves_fft_support tests/test_fft_prevalidation_compatibility.py

  released-interop:
    needs: artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        spectrochempy-version: ["1.1.0", "1.1.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Secure pip bootstrap
        uses: spectrochempy/spectrochempy/.github/actions/verified-pip@cdb087a24f06b8c83ea91ea036192304db9329e3
      - uses: actions/download-artifact@v8
        with:
          name: plugin-dist
          path: dist
      - name: Install released core and NMR wheel without Hypercomplex
        run: |
          python -m pip install "spectrochempy==${{ matrix.spectrochempy-version }}" pytest
          python -m pip install dist/*.whl
          python -m pip check
      - name: Verify isolated wheel installation and optional dependency absence
        run: |
          python -I - <<'PY'
          from importlib.metadata import version
          from importlib.util import find_spec
          from pathlib import Path

          assert version("spectrochempy") == "${{ matrix.spectrochempy-version }}"
          for name in ("spectrochempy_hypercomplex", "quaternion"):
              assert find_spec(name) is None, f"unexpected optional dependency: {name}"
          for name in ("spectrochempy", "spectrochempy_nmr", "nmrglue"):
              location = Path(find_spec(name).origin).resolve()
              assert Path.cwd() not in location.parents, location
              print(f"{name}: {location}")
          PY
      - name: Validate released-core interop and capability refusal
        run: |
          python -I -m pytest -ra tests/test_interop_conversion.py tests/test_agilent_interop_facade.py tests/test_agilent_reference.py tests/test_experiment_interop.py tests/test_processed_interop.py tests/test_processing_architecture.py tests/test_fft_prevalidation_compatibility.py

  pinned-core-tests:
    needs: artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
        with:
          repository: spectrochempy/spectrochempy
          ref: ba25df0c21d117bc99cb9dbe11c6ed92a3b275a9
          path: baseline-core
          fetch-depth: 0
      - name: Fetch verified core release tag for SCM versioning
        run: |
          git -C baseline-core fetch --no-tags https://github.com/spectrochempy/spectrochempy.git refs/tags/spectrochempy-v1.1.4:refs/tags/spectrochempy-v1.1.4
          test "$(git -C baseline-core rev-parse 'spectrochempy-v1.1.4^{commit}')" = a96cb8a6ec076da2fbd9f0e34f24f9955705cf1a
      - name: Secure pip bootstrap
        uses: spectrochempy/spectrochempy/.github/actions/verified-pip@cdb087a24f06b8c83ea91ea036192304db9329e3
      - uses: actions/download-artifact@v8
        with:
          name: plugin-dist
          path: dist
      - name: Build pinned core wheels
        run: |
          python -m pip wheel --no-deps --wheel-dir baseline-wheels ./baseline-core
      - name: Install pinned core and candidate artifact
        run: |
          python -m pip install baseline-wheels/*.whl dist/*.whl pytest
          python -m pip check
      - name: Run synthetic tests against installed artifacts
        run: |
          python -I -m pytest -ra tests/test_linear_prediction.py tests/test_fft_encodings.py tests/test_fft_2d_characterization.py tests/test_nmrpipe_oracle_conventions.py tests/test_nmrpipe_states_tppi_oracle.py tests/test_nmrpipe_echo_antiecho_oracle.py tests/test_topspin_xfb.py tests/test_native_readers.py tests/test_fft_prevalidation_compatibility.py tests/test_complex_channels.py tests/test_quadrature.py tests/test_agilent_noesy_processing.py tests/test_interop_conversion.py tests/test_agilent_interop_facade.py tests/test_agilent_reference.py tests/test_experiment_interop.py tests/test_processed_interop.py tests/test_processing_architecture.py

      - name: Qualify SIMPSON migration and Tecmag reader withdrawal
        run: python -I -m pytest -ra tests/test_read_simpson.py tests/test_simpson_migration.py

      - name: Qualify public TopSpin migrations
        run: |
          python -I -m pytest -ra tests/qualification/test_bruker_pdata_2d.py -k "synthetic and public_reader"
          python -I -m pytest -ra tests/qualification/test_bruker_ser_migration.py -k synthetic

      - name: Qualify saved TopSpin XFB replay against the public COSY reference
        if: matrix.python-version == '3.13'
        env:
          NMR_TOPSPIN_XFB_QF_REFERENCE: ${{ runner.temp }}/topspin-xfb-cosy
        run: |
          reference_url="https://raw.githubusercontent.com/spectrochempy/spectrochempy_data/13a7809e239ee7bff81e509975deadd211bdaf0e/testdata/nmrdata/bruker/tests/nmr/exam2d_HH/1"
          mkdir -p "$NMR_TOPSPIN_XFB_QF_REFERENCE/pdata/1"
          for file in ser acqus acqu2s pdata/1/2rr pdata/1/procs pdata/1/proc2s; do
            curl --fail --silent --show-error --location --retry 3 \
              "$reference_url/$file" --output "$NMR_TOPSPIN_XFB_QF_REFERENCE/$file"
          done
          python -I -m pytest -ra tests/qualification/test_topspin_xfb_roundtrip.py

  pinned-core:
    needs: pinned-core-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every pinned-core matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.pinned-core-tests.result }}
        run: test "$MATRIX_RESULT" = success

  jeol-fid-interop:
    needs: artifacts
    runs-on: ubuntu-latest
    env:
      NMR_JEOL_REFERENCE: /tmp/epicatechin_1h.jdf
      NMR_JEOL_COSY: /tmp/epicatechin_cosy.jdf
      NMR_JEOL_HSQC: /tmp/epicatechin_hsqc.jdf
      NMR_JEOL_HMBC: /tmp/epicatechin_hmbc.jdf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Secure pip bootstrap
        uses: spectrochempy/spectrochempy/.github/actions/verified-pip@cdb087a24f06b8c83ea91ea036192304db9329e3
      - uses: actions/download-artifact@v8
        with:
          name: plugin-dist
          path: dist
      - name: Check out the checksum-pinned JEOL fixtures
        uses: actions/checkout@v7
        with:
          repository: spectrochempy/nmrglue-ng
          ref: 4c18843dc5ce620d63cb35a81bc0b2f862b54346
          path: jeol-provider
          fetch-depth: 0
          persist-credentials: false
      - name: Install the released provider and qualify the public reader
        run: |
          python -m pip install "spectrochempy==1.1.4" pytest
          python -m pip install --only-binary nmrglue-ng "nmrglue-ng==1.2.4" dist/*.whl
          python -m pip check
          cp jeol-provider/tests/fixtures/fileio/data/jeol/epicatechin_1h.jdf "$NMR_JEOL_REFERENCE"
          echo "6ab899b72d314f05d187e07c69389efae30572bae9b0c74fb0249cfa468ae7e0  $NMR_JEOL_REFERENCE" | sha256sum -c -
          python -I -m pytest -ra tests/test_read_jeol.py -k public_jeol_reference
          python -I -m pytest -ra tests/test_native_readers.py::test_jeol_real_qf_reader_preserves_fft_support
      - name: Qualify JEOL 2D with released FFT prevalidation
        run: |
          python -m pip install "spectrochempy==1.2.0"
          python -m pip check
          cp jeol-provider/tests/fixtures/fileio/data/jeol/epicatechin_cosy.jdf "$NMR_JEOL_COSY"
          cp jeol-provider/tests/fixtures/fileio/data/jeol/epicatechin_hsqc.jdf "$NMR_JEOL_HSQC"
          echo "f109351f2102435faa7d302659e073b77ecc1184f1c3ef8817087ca91b9df3aa  $NMR_JEOL_COSY" | sha256sum -c -
          echo "eaa28b4b1fe05f95a41ace4f69f33ee6f31f26f392d3aea1d94bf3978b153625  $NMR_JEOL_HSQC" | sha256sum -c -
          cp jeol-provider/tests/fixtures/fileio/data/jeol/epicatechin_hmbc.jdf "$NMR_JEOL_HMBC"
          echo "578db932e166b04beeb0e9a5db443ff7a042b50e24af2789e535c06c1f6af859  $NMR_JEOL_HMBC" | sha256sum -c -
          python -I -m pytest -ra tests/test_read_jeol.py -k 'cosy_preserves or listed_preserves'
      - name: Qualify the JEOL compatibility reader with the released wheel
        run: |
          python -I -m pytest -ra tests/qualification/test_jeol_fallback.py
