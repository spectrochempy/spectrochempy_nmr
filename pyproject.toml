[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrochempy-nmr"
version = "0.2.0"
description = "NMR readers and tools plugin for SpectroChemPy"
requires-python = ">=3.11"
readme = "README.md"
license-files = ["LICENSE", "NMRGLUE_LICENSE.rst"]
classifiers = [
]
dependencies = [
    "spectrochempy>=1.1.0,<2",
    "numpy",
    "nmrglue-ng>=1.2.3,<2",
]

[project.entry-points."spectrochempy.plugins"]
nmr = "spectrochempy_nmr:NMRPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/spectrochempy_nmr/extern", "tests/data"]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["E402", "F401"]

[tool.spectrochempy]
official-plugin = true
