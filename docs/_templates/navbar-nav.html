{% set sections = [
  ('Getting started', 'getting_started/index'),
  ('Guides', 'userguide/index'),
  ('API', 'reference/index'),
  ('Examples', 'examples_overview'),
  ('About', 'about')
] %}
<nav class="nmr-navbar" aria-label="{{ _('Main navigation') }}">
  <ul class="bd-navbar-elements navbar-nav">
    {% for label, target in sections %}
      {% if hasdoc(target) %}
        <li class="nav-item{% if section_title == label %} current active{% endif %}">
          <a class="nav-link{% if section_title == label %} active{% endif %}" href="{{ pathto(target) }}"{% if pagename == target %} aria-current="page"{% endif %}>{{ label }}</a>
        </li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
